services:
  - type: web
    name: laes-data-proof
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: laes-postgres
          property: connectionString
      - key: KOPYON_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.8

databases:
  - name: laes-postgres
    databaseName: laes
    user: laes_user
    plan: free
    region: singapore
    postgresMajorVersion: 18
