name: LAES offline release-candidate validation

on:
  push:
    branches:
      - "repair/**"
  pull_request:

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app dependencies
        run: pip install -r requirements.txt
      - name: Compile Python application
        run: python -m py_compile app.py
      - name: Run exit-policy regression tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate dashboard JavaScript
        run: node --check static/app.js
      - name: Build offline ZIP
        run: |
          zip -r LAES-offline-release-candidate.zip . \
            -x ".git/*" ".env" ".venv/*" "__pycache__/*" "*.pyc" "*.db" ".pytest_cache/*"
      - uses: actions/upload-artifact@v4
        with:
          name: LAES-offline-release-candidate
          path: LAES-offline-release-candidate.zip
          retention-days: 14
